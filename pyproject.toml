[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepshield"
version = "0.1.0"
description = "Personal Deepfake Identity Protection & Multi-Signal Detection System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DeepShield Project" }]
keywords = ["deepfake", "face-recognition", "watermark", "forensics", "adversarial-ml"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
face = ["insightface>=0.7.3", "onnxruntime>=1.17", "opencv-python>=4.9"]
torch = ["torch>=2.2", "torchvision>=0.17"]
video = ["opencv-python>=4.9", "av>=12.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "sqlalchemy>=2.0"]
experiments = ["pandas>=2.2", "matplotlib>=3.8", "scikit-learn>=1.4", "scipy>=1.12"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
deepshield = "deepshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take significant time",
    "requires_models: tests that need downloaded model weights",
    "integration: end-to-end pipeline tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.mypy]
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ANN202"]
"src/deepshield/api/app.py" = ["B008"]
"scripts/**" = ["E402"]
